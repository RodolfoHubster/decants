<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/login.css">

</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-mark">FS</div>
    <h1>Fitoscents</h1>
    <p>Panel de Administracion</p>
  </div>
  <div class="form-group">
    <label>Correo electronico</label>
    <input class="form-control" type="email" id="email" placeholder="admin@fitoscents.com" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Contrasena</label>
    <div style="position:relative">
      <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
      <button type="button" onclick="togglePass()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px">
        <i class="bi bi-eye" id="eye-icon"></i>
      </button>
    </div>
  </div>
  <div class="err" id="err-msg"></div>
  <button class="btn btn-primary" style="width:100%;margin-top:20px;justify-content:center;padding:12px" id="btn-login">
    <i class="bi bi-box-arrow-in-right"></i> Ingresar
  </button>
</div>
<script type="module" src="./assets/js/login.js"></script>
</body>
</html>
