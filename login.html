<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/global.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:radial-gradient(ellipse at top,#1a1500 0%,#0d0d0d 60%)}
    .login-card{width:100%;max-width:400px;padding:40px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 24px 64px rgba(0,0,0,.6)}
    .login-logo{text-align:center;margin-bottom:32px}
    .login-logo .logo-mark{width:64px;height:64px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#000;margin:0 auto 12px}
    .login-logo h1{font-size:22px;font-weight:700}.login-logo p{font-size:13px;color:var(--text-muted)}
    .err{color:var(--danger);font-size:13px;margin-top:12px;display:none;padding:10px 14px;background:rgba(224,92,92,.1);border-radius:var(--radius-sm);border:1px solid rgba(224,92,92,.25)}
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-mark">FS</div>
    <h1>Fitoscents</h1>
    <p>Panel de Administracion</p>
  </div>
  <div class="form-group">
    <label>Correo electronico</label>
    <input class="form-control" type="email" id="email" placeholder="admin@fitoscents.com" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Contrasena</label>
    <div style="position:relative">
      <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
      <button type="button" onclick="togglePass()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px">
        <i class="bi bi-eye" id="eye-icon"></i>
      </button>
    </div>
  </div>
  <div class="err" id="err-msg"></div>
  <button class="btn btn-primary" style="width:100%;margin-top:20px;justify-content:center;padding:12px" id="btn-login">
    <i class="bi bi-box-arrow-in-right"></i> Ingresar
  </button>
</div>
<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './assets/js/firebase-config.js';
onAuthStateChanged(auth, u=>{ if(u) window.location.href='./admin/dashboard.html'; });
document.getElementById('btn-login').onclick = async()=>{
  const e=document.getElementById('email').value.trim();
  const p=document.getElementById('password').value;
  const err=document.getElementById('err-msg');
  const btn=document.getElementById('btn-login');
  err.style.display='none';
  if(!e||!p){err.textContent='Completa todos los campos.';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<i class="bi bi-hourglass-split"></i> Verificando...';
  try{
    await signInWithEmailAndPassword(auth,e,p);
  }catch(ex){
    err.textContent='Correo o contrasena incorrectos.';err.style.display='block';
    btn.disabled=false;btn.innerHTML='<i class="bi bi-box-arrow-in-right"></i> Ingresar';
  }
};
window.togglePass=()=>{
  const i=document.getElementById('password');
  const ic=document.getElementById('eye-icon');
  i.type=i.type==='password'?'text':'password';
  ic.className=i.type==='password'?'bi bi-eye':'bi bi-eye-slash';
};
document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-login').click();});
</script>
</body>
</html>
