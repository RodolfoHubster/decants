<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Dashboard</span>
      </div>
      <a href="../index.html" target="_blank" class="btn btn-outline btn-sm"><i class="bi bi-shop"></i> Ver tienda</a>
    </div>
    <div class="page-body">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Perfumes</div><div class="stat-value" id="s-perf">—</div><div class="stat-sub">en catalogo</div><i class="bi bi-droplet-fill stat-icon"></i></div>
        <div class="stat-card"><div class="stat-label">Marcas</div><div class="stat-value" id="s-marc">—</div><div class="stat-sub">registradas</div><i class="bi bi-award-fill stat-icon"></i></div>
        <div class="stat-card"><div class="stat-label">Categorias</div><div class="stat-value" id="s-cat">—</div><div class="stat-sub">activas</div><i class="bi bi-tags-fill stat-icon"></i></div>
        <div class="stat-card"><div class="stat-label">Visibles en tienda</div><div class="stat-value" id="s-vis">—</div><div class="stat-sub">perfumes activos</div><i class="bi bi-eye stat-icon"></i></div>
      </div>
      <div class="card">
        <div class="card-header"><h5>Acciones rapidas</h5></div>
        <div class="card-body" style="display:flex;gap:12px;flex-wrap:wrap">
          <a href="perfumes.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo perfume</a>
          <a href="marcas.html" class="btn btn-outline"><i class="bi bi-award"></i> Agregar marca</a>
          <a href="categorias.html" class="btn btn-outline"><i class="bi bi-tags"></i> Agregar categoria</a>
          <a href="../index.html" target="_blank" class="btn btn-outline"><i class="bi bi-shop"></i> Ver tienda publica</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { db, collection, getDocs, query, where } from '../assets/js/firebase-config.js';
import { renderSidebar } from './sidebar.js';
import './auth-guard.js';

renderSidebar('dashboard');
if (window.innerWidth <= 768) document.getElementById('menu-btn').style.display = 'flex';

async function loadStats() {
  const [p, m, c, pv] = await Promise.all([
    getDocs(collection(db, 'perfumes')),
    getDocs(collection(db, 'marcas')),
    getDocs(collection(db, 'categorias')),
    getDocs(query(collection(db, 'perfumes'), where('activo', '==', true))),
  ]);
  document.getElementById('s-perf').textContent = p.size;
  document.getElementById('s-marc').textContent = m.size;
  document.getElementById('s-cat').textContent = c.size;
  document.getElementById('s-vis').textContent = pv.size;
}
loadStats();
</script>
</body>
</html>
