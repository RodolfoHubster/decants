<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Hoy</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css?v=3.0">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Hoy</span>
      </div>
      <a href="../index.html" target="_blank" class="btn btn-outline btn-sm"><i class="bi bi-shop"></i> <span class="hide-sm">Ver tienda</span></a>
    </div>

    <div class="page-body hoy">

      <header class="hoy-saludo">
        <h1 id="hoy-saludo">Hola</h1>
        <p id="hoy-fecha"></p>
      </header>

      <!-- Dinero: lo primero que importa -->
      <section class="hoy-dinero" aria-label="Ventas">
        <div class="dinero-principal">
          <span class="dinero-label">Vendido hoy</span>
          <strong class="dinero-valor" id="d-hoy">—</strong>
          <span class="dinero-sub" id="d-hoy-sub">&nbsp;</span>
        </div>
        <div class="dinero-sec">
          <div>
            <span class="dinero-label">Esta semana</span>
            <strong id="d-semana">—</strong>
          </div>
          <div>
            <span class="dinero-label">Este mes</span>
            <strong id="d-mes">—</strong>
            <span class="dinero-cambio" id="d-cambio"></span>
          </div>
        </div>
      </section>

      <!-- Acciones: lo que haces en el día, a un toque -->
      <nav class="hoy-acciones" aria-label="Acciones rápidas">
        <a href="perfumes.html?pos=1" class="accion accion-vender">
          <i class="bi bi-bag-plus-fill"></i><span>Vender</span>
        </a>
        <a href="ventas.html?openDia=1" class="accion">
          <i class="bi bi-receipt"></i><span>Registrar ventas</span>
        </a>
        <a href="encargos.html?nuevo=1" class="accion">
          <i class="bi bi-kanban"></i><span>Nuevo encargo</span>
        </a>
        <a href="costos.html" class="accion">
          <i class="bi bi-wallet2"></i><span>Registrar gasto</span>
        </a>
      </nav>

      <!-- Recordatorios -->
      <section class="hoy-bloque">
        <div class="bloque-head">
          <h2><i class="bi bi-bell-fill"></i> Pendientes</h2>
          <span class="bloque-count" id="pend-count"></span>
        </div>
        <div id="pendientes" class="pendientes">
          <div class="pend-cargando">Revisando tu negocio…</div>
        </div>
      </section>

      <!-- Lo que se mueve -->
      <section class="hoy-bloque">
        <div class="bloque-head">
          <h2><i class="bi bi-fire"></i> Lo que más se vende este mes</h2>
        </div>
        <ol id="top-mes" class="top-lista">
          <li class="pend-cargando">Cargando…</li>
        </ol>
      </section>

      <!-- Catálogo, en una línea -->
      <section class="hoy-catalogo" id="hoy-catalogo"></section>

    </div>
  </div>
</div>
<script type="module" src="../assets/js/dashboard.js?v=3.1"></script>
</body>
</html>
