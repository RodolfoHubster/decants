<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Perfumes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/perfumes.css">
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Perfumes</span>
      </div>
      <div style="display:flex;gap:12px">
        <button class="btn btn-outline" onclick="exportPrices()"><i class="bi bi-download"></i> Exportar Lista</button>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Perfume</button>
      </div>
    </div>
    <div class="page-body">
      <div style="display:flex;gap:10px;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:10px">
        <button class="btn btn-outline" id="tab-main" onclick="switchTab('main')" style="background:var(--bg-card);border-color:var(--gold)"><i class="bi bi-shop"></i> Catálogo Principal</button>
        <button class="btn btn-outline" id="tab-archived" onclick="switchTab('archived')"><i class="bi bi-archive"></i> Archivados</button>
      </div>
      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar perfume o marca..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:160px" id="f-genero" onchange="renderTable()"><option value="">Todos</option><option>Caballero</option><option>Dama</option><option>Unisex</option></select>
        <select class="form-control" style="max-width:180px" id="f-cat" onchange="renderTable()"><option value="">Todas las categorias</option></select>
        <select class="form-control" style="max-width:180px" id="f-marca" onchange="renderTable()"><option value="">Todas las marcas</option></select>
        <select class="form-control" style="max-width:160px" id="f-familia" onchange="renderTable()">
          <option value="">Todas las familias</option>
        </select>
        <select class="form-control" style="max-width:160px" id="f-tipo" onchange="renderTable()">
          <option value="">Todos los tipos</option>
        </select>
        <select class="form-control" style="max-width:160px" id="f-novedad" onchange="renderTable()">
          <option value="">Todas las Novedades</option>
          <option value="1">✨ Solo Novedades</option>
        </select>
        <select class="form-control" style="max-width:150px" id="f-stock" onchange="renderTable()">
          <option value="">Todo el Stock</option>
          <option value="por_acabarse">🟡 Por acabarse</option>
          <option value="agotado">🔴 Agotados</option>
        </select>
        <select class="form-control" style="max-width:180px" id="f-orden" onchange="window.sortByDropdown()">
          <option value="">Orden manual</option>
          <option value="clicks">🔥 Más populares</option>
          <option value="recientes">✨ Agregados recientemente</option>
          <option value="antiguos">🕒 Más antiguos</option>
          <option value="az">Nombre A-Z</option>
          <option value="za">Nombre Z-A</option>
        </select>
        <button class="btn btn-outline" id="btn-toggle-view" onclick="toggleAdminView()" title="Cambiar Vista" style="padding:0 12px;display:flex;align-items:center;justify-content:center"><i class="bi bi-grid-fill"></i></button>
      </div>
      <div class="card">
        <div class="card-header"><h5>Catalogo de Perfumes</h5><span class="badge badge-muted" id="count-label">0 perfumes</span></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th onclick="sortBy('nombre')" style="cursor:pointer">Nombre <i class="bi bi-chevron-expand sort-icon" id="sort-nombre" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('marca')" style="cursor:pointer">Marca <i class="bi bi-chevron-expand sort-icon" id="sort-marca" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('categoria')" style="cursor:pointer">Categoria <i class="bi bi-chevron-expand sort-icon" id="sort-categoria" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('genero')" style="cursor:pointer">Genero <i class="bi bi-chevron-expand sort-icon" id="sort-genero" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('familia')" style="cursor:pointer">Familia <i class="bi bi-chevron-expand sort-icon" id="sort-familia" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('tipo')" style="cursor:pointer">Tipo <i class="bi bi-chevron-expand sort-icon" id="sort-tipo" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th onclick="sortBy('clicks')" class="col-clicks" style="cursor:pointer"><i class="bi bi-eye"></i> Clicks <i class="bi bi-chevron-expand sort-icon" id="sort-clicks" style="font-size:10px;opacity:0.3;margin-left:4px"></i></th>
                <th>Precios</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pagination-wrap" style="display:flex;justify-content:space-between;align-items:center;padding:15px;border-top:1px solid var(--border)"></div>
        <div id="pos-grid" class="pos-grid" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-header"><h4 id="modal-title">Nuevo Perfume</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="p-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" style="color: #bbb;">Nombre Perfume</label>
          <div class="input-group" style="display:flex;">
            <input type="text" class="form-control" id="p-nombre" required style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
            <button class="btn btn-outline-warning" type="button" id="btn-ia-name" title="Autocompletar perfil con IA" style="border-color: rgba(255,255,255,0.1); margin-left: 5px;">
              <i class="bi bi-magic"></i> IA
            </button>
          </div>
        </div>
        <div class="form-group"><label>Genero *</label><select class="form-control" id="p-genero"><option value="">Selecciona</option><option>Caballero</option><option>Dama</option><option>Unisex</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Categoria *</label><select class="form-control" id="p-cat" onchange="loadMarcas()"><option value="">Selecciona</option></select></div>
        <div class="form-group"><label>Marca *</label><select class="form-control" id="p-marca"><option value="">Selecciona</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Familia Olfativa</label>
          <select class="form-control" id="p-familia"><option value="">Sin especificar</option></select>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select class="form-control" id="p-tipo"><option value="">Sin especificar</option></select>
        </div>
      </div>
      <div class="form-group"><label>Notas / Descripcion</label><textarea class="form-control" id="p-desc" rows="2" placeholder="Vainilla, madera, ambar..."></textarea></div>
      <div class="form-group"><label>Código de Barras (UPC/EAN)</label><input class="form-control" id="p-barcode" placeholder="Escanéalo o escríbelo..."></div>
      <div class="form-group">
        <label>Imagen</label>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button type="button" class="btn btn-outline btn-sm" id="btn-url" onclick="setMode('url')"><i class="bi bi-link-45deg"></i> URL</button>
          <button type="button" class="btn btn-outline btn-sm" id="btn-file" onclick="setMode('file')"><i class="bi bi-upload"></i> Subir</button>
        </div>
        <div id="sec-url"><input class="form-control" id="p-img-url" placeholder="https://..." oninput="previewUrl()"></div>
        <div id="sec-file" style="display:none">
          <input type="file" class="form-control" id="p-img-file" accept="image/*" onchange="previewFile()">
          <p style="font-size:11px;color:#666;margin-top:4px"><i class="bi bi-cloud-upload"></i> La imagen se subirá a Cloudinary al guardar.</p>
        </div>
        <div id="preview-wrap" class="img-preview-wrap" style="display:none;margin-top:10px"><img id="preview-img" src="" alt=""></div>
      </div>
      <div class="form-group">
        <label>Precios por tamano (MXN) — 0 si no aplica</label>
        <div class="precios-grid">
          <div class="precio-item"><label>2 ml</label><input class="form-control" type="number" id="px2" min="0" placeholder="0"></div>
          <div class="precio-item"><label>3 ml</label><input class="form-control" type="number" id="px3" min="0" placeholder="0"></div>
          <div class="precio-item"><label>5 ml</label><input class="form-control" type="number" id="px5" min="0" placeholder="0"></div>
          <div class="precio-item"><label>10 ml</label><input class="form-control" type="number" id="px10" min="0" placeholder="0"></div>
        </div>
      </div>
      
      <!-- ── Toggles: Estado + Novedad + Stock ── -->
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
        <div class="form-row">
          <div class="form-group" style="margin-bottom:0;flex:1">
            <label>Estado del perfume</label>
            <select class="form-control" id="p-estado">
              <option value="visible">🟢 Visible en catálogo</option>
              <option value="oculto">🟡 Oculto (Solo admin)</option>
              <option value="archivado">🔴 Archivado</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;flex:1">
            <label>Estado Stock Físico</label>
            <select class="form-control" id="p-stock">
              <option value="normal">🟢 Normal</option>
              <option value="por_acabarse">🟡 Por acabarse</option>
              <option value="agotado">🔴 Agotado</option>
            </select>
          </div>
        </div>
        
        <div class="form-group" style="margin-top:15px; border-top:1px solid var(--border); padding-top:15px">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <label style="margin:0">Inventario de Botellas (Lotes)</label>
            <button class="btn btn-outline btn-sm" onclick="addLoteUI()"><i class="bi bi-plus-lg"></i> Agregar Botella</button>
          </div>
          <div id="lotes-container" style="display:flex; flex-direction:column; gap:10px"></div>
          <div style="font-size:11px; color:var(--text-faint); margin-top:8px;">* Selecciona el círculo izquierdo para marcar la botella actualmente abierta/en uso.</div>
        </div>

        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px" title="Aparece en Novedades">
          <input type="checkbox" id="p-novedad" style="width:16px;height:16px;accent-color:#e0b95a">
          <span>✨ Marcar como <strong>Novedad</strong></span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar Perfume</button>
    </div>
  </div>
</div>

<!-- MODAL POS RÁPIDO -->
<div class="modal-overlay" id="modal-pos" style="z-index:9020">
  <div class="modal-box" style="max-width:400px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden">
    <div style="position:relative">
      <img id="pos-m-img" src="" style="width:100%;height:220px;object-fit:cover;background:var(--bg-card2)">
      <button class="btn-icon" onclick="closePosModal()" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:#fff;border-radius:50%"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="padding:20px;">
      <div style="display:flex;align-items:flex-start;gap:8px;">
        <h3 id="pos-m-nombre" style="font-size:18px;font-weight:700;margin-bottom:4px;line-height:1.2;flex:1;">Nombre Perfume</h3>
        <button class="btn-icon" id="btn-copy-pos" onclick="copyPosPrices()" aria-label="Copiar precios" title="Copiar precios" style="margin-top:-2px; color:var(--text-muted); font-size:16px; padding:4px;">
          <i class="bi bi-copy"></i>
        </button>
      </div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px"><span id="pos-m-marca">Marca</span> • <span id="pos-m-familia">Familia</span></div>
      
      <div id="pos-m-precios" style="display:grid;grid-template-columns:1fr;gap:10px;">
        <!-- Botones inyectados dinamicamente -->
      </div>
    </div>
  </div>
</div>

<script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
<script type="module" src="../assets/js/perfumes.js?v=2.15"></script>
</body>
</html>
