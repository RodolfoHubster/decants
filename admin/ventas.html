<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Ventas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/ventas.css">


</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Ventas de Decants</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nueva Venta</button>
    </div>
    <div class="page-body">

      <!-- KPIs -->
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">💰 Total vendido</div><div class="kpi-value" id="k-total">$0</div><div class="kpi-sub">todas las ventas</div></div>
        <div class="kpi-card"><div class="kpi-label">📦 Decants vendidos</div><div class="kpi-value" id="k-cant">0</div><div class="kpi-sub">unidades</div></div>
        <div class="kpi-card"><div class="kpi-label">✅ Pagadas</div><div class="kpi-value" id="k-pagadas">0</div><div class="kpi-sub">cobradas</div></div>
        <div class="kpi-card"><div class="kpi-label">⏳ Pendientes</div><div class="kpi-value" id="k-pend">0</div><div class="kpi-sub">por cobrar</div></div>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar cliente o perfume..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:150px" id="f-estado" onchange="renderTable()">
          <option value="">Todos los estados</option>
          <option value="pagada">Pagada</option>
          <option value="pendiente">Pendiente</option>
          <option value="cancelada">Cancelada</option>
        </select>
        <select class="form-control" style="max-width:150px" id="f-periodo" onchange="renderTable()">
          <option value="">Todo el tiempo</option>
          <option value="hoy">Hoy</option>
          <option value="7">Últimos 7 días</option>
          <option value="30">Últimos 30 días</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header"><h5>Historial de Ventas</h5><span class="badge badge-muted" id="count-label">0 ventas</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Perfume</th><th>Talla</th><th>Precio</th><th>Cliente</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVA VENTA -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><h4 id="modal-title">Nueva Venta</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="v-id">
      <div class="form-row">
        <div class="form-group">
          <label>Perfume *</label>
          <select class="form-control" id="v-perfume" onchange="onPerfumeChange()">
            <option value="">Selecciona perfume</option>
          </select>
        </div>
        <div class="form-group">
          <label>Talla (ml) *</label>
          <select class="form-control" id="v-talla">
            <option value="">Selecciona talla</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio de venta ($MXN) *</label>
          <input class="form-control" type="number" id="v-precio" placeholder="0.00" min="0">
        </div>
        <div class="form-group">
          <label>Cantidad</label>
          <input class="form-control" type="number" id="v-cantidad" value="1" min="1">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cliente</label>
          <input class="form-control" id="v-cliente" placeholder="Nombre del cliente">
        </div>
        <div class="form-group">
          <label>Estado *</label>
          <select class="form-control" id="v-estado">
            <option value="pagada">Pagada ✅</option>
            <option value="pendiente">Pendiente ⏳</option>
            <option value="cancelada">Cancelada ❌</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <textarea class="form-control" id="v-notas" rows="2" placeholder="Observaciones opcionales..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar Venta</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR ESTADO -->
<div class="modal-overlay" id="modal-estado">
  <div class="modal-box" style="max-width:360px">
    <div class="modal-header"><h4>Cambiar Estado</h4><button class="btn-icon" onclick="closeEstado()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="es-id">
      <div class="form-group">
        <label>Nuevo estado</label>
        <select class="form-control" id="es-valor">
          <option value="pagada">Pagada ✅</option>
          <option value="pendiente">Pendiente ⏳</option>
          <option value="cancelada">Cancelada ❌</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeEstado()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEstado()">Actualizar</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/ventas.js"></script>\
</body>
</html>
