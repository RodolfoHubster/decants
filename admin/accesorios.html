<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Accesorios</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Accesorios Extras</span>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Accesorio</button>
      </div>
    </div>
    
    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <h5>Inventario de Accesorios</h5>
          <span class="badge badge-muted" id="count-label">0 accesorios</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre del Accesorio</th>
                <th>Costo (Para ti)</th>
                <th>Precio (Venta)</th>
                <th>Stock Disponible</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-faint)">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ACCESORIO -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-header">
      <h4 id="modal-title">Nuevo Accesorio</h4>
      <button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="a-id">
      
      <div class="form-group">
        <label>Nombre del Accesorio *</label>
        <input type="text" class="form-control" id="a-nombre" required placeholder="Ej. Decant Travel 10ml">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Costo de Adquisición ($) *</label>
          <input type="number" class="form-control" id="a-costo" required step="0.5" placeholder="0">
        </div>
        <div class="form-group">
          <label>Precio de Venta ($) *</label>
          <input type="number" class="form-control" id="a-precio" required step="1" placeholder="0">
        </div>
      </div>
      
      <div class="form-group" style="margin-top:8px;">
        <label>Precios por tamaño (MXN) — <span style="color:var(--text-muted);font-weight:normal;">Opcional, 0 si no aplica</span></label>
        <div class="precios-grid">
          <div class="precio-item"><label>2 ml</label><input class="form-control" type="number" id="a-px2" min="0" placeholder="0"></div>
          <div class="precio-item"><label>3 ml</label><input class="form-control" type="number" id="a-px3" min="0" placeholder="0"></div>
          <div class="precio-item"><label>5 ml</label><input class="form-control" type="number" id="a-px5" min="0" placeholder="0"></div>
          <div class="precio-item"><label>10 ml</label><input class="form-control" type="number" id="a-px10" min="0" placeholder="0"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label>Stock Disponible *</label>
        <input type="number" class="form-control" id="a-stock" required min="0" placeholder="0">
      </div>
      
      <div class="form-group">
        <label>Estado</label>
        <select class="form-control" id="a-activo">
          <option value="true">Activo / Visible en Ventas</option>
          <option value="false">Oculto</option>
        </select>
      </div>
      
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/accesorios.js?v=1.0"></script>
</body>
</html>
