<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/pedidos.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Pedidos</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Pedido</button>
    </div>
    <div class="page-body">

      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label"><i class="bi bi-asterisk"></i> Nuevos</div><div class="kpi-value" id="k-nuevo">—</div></div>
        <div class="kpi-card"><div class="kpi-label"><i class="bi bi-gear-fill"></i> Preparando</div><div class="kpi-value" id="k-prep">—</div></div>
        <div class="kpi-card"><div class="kpi-label"><i class="bi bi-truck"></i> Enviados</div><div class="kpi-value" id="k-env">—</div></div>
        <div class="kpi-card"><div class="kpi-label"><i class="bi bi-check-circle-fill"></i> Entregados</div><div class="kpi-value" id="k-ent">—</div></div>
      </div>

      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar cliente o folio..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:160px" id="f-estado" onchange="renderTable()">
          <option value="">Todos los estados</option>
          <option value="nuevo">Nuevo</option>
          <option value="preparando">Preparando</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header"><h5>Listado de Pedidos</h5><span class="badge badge-muted" id="count-label">0 pedidos</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Items</th><th>Total</th><th>Guía</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVO PEDIDO -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-header"><h4 id="modal-title">Nuevo Pedido</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="p-id">
      <div class="form-row">
        <div class="form-group">
          <label>Cliente *</label>
          <input class="form-control" id="p-cliente" placeholder="Nombre del cliente">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input class="form-control" id="p-tel" placeholder="+52 664...">
        </div>
      </div>
      <div class="form-group">
        <label>Dirección de envío</label>
        <input class="form-control" id="p-dir" placeholder="Calle, colonia, ciudad...">
      </div>
      <div class="form-group">
        <label>Estado del pedido</label>
        <select class="form-control" id="p-estado">
          <option value="nuevo">Nuevo</option>
          <option value="preparando">Preparando</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
        </select>
      </div>
      <div style="margin-bottom:8px;font-weight:500">Items</div>
      <div id="items-container"></div>
      <button type="button" class="btn btn-outline btn-sm" onclick="addItem()"><i class="bi bi-plus"></i> Agregar item</button>
      <div style="text-align:right;margin-top:12px;font-weight:600">Total: <span id="lbl-total">$0.00</span></div>
      <div class="form-group" style="margin-top:12px">
        <label>Notas</label>
        <textarea class="form-control" id="p-notas" rows="2" placeholder="Instrucciones de entrega, etc."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="modal-detalle">
  <div class="modal-box" style="max-width:520px">
    <div class="modal-header"><h4>Detalle del Pedido</h4><button class="btn-icon" onclick="closeDetalle()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" id="detalle-body"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeDetalle()">Cerrar</button></div>
  </div>
</div>

<!-- MODAL TRACKING -->
<div class="modal-overlay" id="modal-tracking">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-header"><h4>Guía de Rastreo</h4><button class="btn-icon" onclick="closeTracking()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="tr-id">
      <div class="form-group">
        <label>Número de guía</label>
        <input class="form-control" id="tr-num" placeholder="Ej. 9400111899223397059926">
        <small style="color:var(--text-faint)">Se guarda en el historial del pedido automáticamente.</small>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeTracking()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarTracking()"><i class="bi bi-check2"></i> Guardar guía</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/pedidos.js"></script>
</body>
</html>
