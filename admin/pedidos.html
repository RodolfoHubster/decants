<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/pedidos.css">

</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Pedidos</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Pedido</button>
    </div>
    <div class="page-body">

      <!-- KPIs -->
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">📬 Nuevos</div><div class="kpi-value" id="k-nuevo">0</div><div class="kpi-sub">por atender</div></div>
        <div class="kpi-card"><div class="kpi-label">📦 Preparando</div><div class="kpi-value" id="k-prep">0</div><div class="kpi-sub">en proceso</div></div>
        <div class="kpi-card"><div class="kpi-label">🚚 Enviados</div><div class="kpi-value" id="k-env">0</div><div class="kpi-sub">en camino</div></div>
        <div class="kpi-card"><div class="kpi-label">✅ Entregados</div><div class="kpi-value" id="k-ent">0</div><div class="kpi-sub">completados</div></div>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar cliente o folio..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:160px" id="f-estado" onchange="renderTable()">
          <option value="">Todos</option>
          <option value="nuevo">Nuevo</option>
          <option value="preparando">Preparando</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header"><h5>Lista de Pedidos</h5><span class="badge badge-muted" id="count-label">0 pedidos</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Items</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVO PEDIDO -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header"><h4 id="modal-title">Nuevo Pedido</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="p-id">
      <div class="form-row">
        <div class="form-group"><label>Cliente *</label><input class="form-control" id="p-cliente" placeholder="Nombre del cliente"></div>
        <div class="form-group"><label>Teléfono / WhatsApp</label><input class="form-control" id="p-tel" placeholder="664-000-0000"></div>
      </div>
      <div class="form-group"><label>Dirección de envío</label><input class="form-control" id="p-dir" placeholder="Calle, colonia, ciudad..."></div>
      <div class="form-group">
        <label>Items del pedido</label>
        <div id="items-container"></div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px" onclick="addItem()"><i class="bi bi-plus"></i> Agregar item</button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Estado</label>
          <select class="form-control" id="p-estado">
            <option value="nuevo">Nuevo</option>
            <option value="preparando">Preparando</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div class="form-group"><label>Notas</label><input class="form-control" id="p-notas" placeholder="Observaciones..."></div>
      </div>
    </div>
    <div class="modal-footer">
      <div style="font-size:13px;color:var(--text-muted)">Total: <strong id="lbl-total" style="color:var(--accent)">$0.00</strong></div>
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="modal-detalle">
  <div class="modal-box" style="max-width:500px">
    <div class="modal-header"><h4>Detalle del Pedido</h4><button class="btn-icon" onclick="closeDetalle()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" id="detalle-body"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeDetalle()">Cerrar</button></div>
  </div>
</div>

<script type="module" src="../assets/js/pedidos.js"></script>
</body>
</html>
