<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Marcas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Marcas</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nueva Marca</button>
    </div>
    <div class="page-body">
      <div class="filter-bar">
        <div class="search-input-wrap" style="max-width:300px"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar marca..." oninput="render()"></div>
        <select class="form-control" id="f-cat" style="max-width:200px" onchange="render()"><option value="">Todas las categorias</option></select>
      </div>
      <div class="card">
        <div class="card-header"><h5>Marcas de Perfume</h5><span class="badge badge-muted" id="count-label">0 marcas</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Marca</th><th>Categoria</th><th>Origen</th><th>Perfumes</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header"><h4 id="modal-title">Nueva Marca</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="m-id">
      <div class="form-group"><label>Nombre *</label><input class="form-control" id="m-nombre" placeholder="Lattafa, Versace, Dior..."></div>
      <div class="form-row">
        <div class="form-group"><label>Categoria *</label><select class="form-control" id="m-cat"><option value="">Selecciona</option></select></div>
        <div class="form-group"><label>Pais de origen</label><input class="form-control" id="m-origen" placeholder="Francia, Emiratos..."></div>
      </div>
      <div class="form-group"><label>Descripcion</label><textarea class="form-control" id="m-desc" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="save()"><i class="bi bi-check2"></i> Guardar</button>
    </div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Guard: si no hay sesión, regresa al login
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/login.html";
  }
});
import { db, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from '../assets/js/firebase-config.js';
import { renderSidebar } from './sidebar.js';
import { toast } from '../assets/js/toast.js';
import './auth-guard.js';
renderSidebar('marcas');
if(window.innerWidth<=768) document.getElementById('menu-btn').style.display='flex';
let marcas=[], cats=[], perfCount={};
async function load(){
  const [ms,cs,ps]=await Promise.all([getDocs(collection(db,'marcas')),getDocs(collection(db,'categorias')),getDocs(collection(db,'perfumes'))]);
  cats=[];cs.forEach(d=>cats.push({id:d.id,...d.data()}));cats.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  perfCount={};ps.forEach(d=>{const m=(d.data().marca||'');perfCount[m]=(perfCount[m]||0)+1;});
  marcas=[];ms.forEach(d=>marcas.push({id:d.id,...d.data()}));marcas.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const opts=cats.map(c=>`<option>${c.nombre}</option>`).join('');
  document.getElementById('f-cat').innerHTML=`<option value="">Todas las categorias</option>${opts}`;
  document.getElementById('m-cat').innerHTML=`<option value="">Selecciona</option>${opts}`;
  render();
}
window.render=()=>{
  const q=document.getElementById('search').value.toLowerCase();
  const fc=document.getElementById('f-cat').value;
  const fil=marcas.filter(m=>(!q||m.nombre.toLowerCase().includes(q))&&(!fc||m.categoria===fc));
  document.getElementById('count-label').textContent=fil.length+' marcas';
  const tb=document.getElementById('tbody');
  if(!fil.length){tb.innerHTML='<tr><td colspan="5"><div class="empty-state"><i class="bi bi-award"></i><h3>Sin marcas</h3><p>Agrega la primera.</p></div></td></tr>';return;}
  tb.innerHTML=fil.map(m=>`<tr>
    <td><strong>${m.nombre}</strong></td>
    <td><span class="badge badge-info">${m.categoria||'—'}</span></td>
    <td style="color:var(--text-muted);font-size:13px">${m.origen||'—'}</td>
    <td><span class="badge badge-gold">${perfCount[m.nombre]||0} perfumes</span></td>
    <td><div style="display:flex;gap:8px">
      <button class="btn-icon" onclick="edit('${m.id}')"><i class="bi bi-pencil"></i></button>
      <button class="btn-icon" onclick="del('${m.id}','${m.nombre.replace(/'/g,'')}')"><i class="bi bi-trash" style="color:var(--danger)"></i></button>
    </div></td>
  </tr>`).join('');
};
window.openModal=()=>{['m-id','m-nombre','m-origen','m-desc'].forEach(id=>document.getElementById(id).value='');document.getElementById('m-cat').value='';document.getElementById('modal-title').textContent='Nueva Marca';document.getElementById('modal').classList.add('open');};
window.closeModal=()=>document.getElementById('modal').classList.remove('open');
window.edit=(id)=>{const m=marcas.find(x=>x.id===id);if(!m)return;document.getElementById('m-id').value=m.id;document.getElementById('m-nombre').value=m.nombre;document.getElementById('m-cat').value=m.categoria||'';document.getElementById('m-origen').value=m.origen||'';document.getElementById('m-desc').value=m.descripcion||'';document.getElementById('modal-title').textContent='Editar Marca';document.getElementById('modal').classList.add('open');};
window.save=async()=>{const id=document.getElementById('m-id').value;const nombre=document.getElementById('m-nombre').value.trim();const categoria=document.getElementById('m-cat').value;if(!nombre){toast('Nombre obligatorio','error');return;}if(!categoria){toast('Selecciona categoria','error');return;}const data={nombre,categoria,origen:document.getElementById('m-origen').value.trim(),descripcion:document.getElementById('m-desc').value.trim()};try{if(id)await updateDoc(doc(db,'marcas',id),data);else await addDoc(collection(db,'marcas'),{...data,creadoEn:Date.now()});toast(id?'Marca actualizada':'Marca creada','success');closeModal();load();}catch(e){toast('Error: '+e.message,'error');}};
window.del=async(id,nombre)=>{if(!confirm('Eliminar marca '+nombre+'?'))return;await deleteDoc(doc(db,'marcas',id));toast('Eliminada','info');load();};
load();
</script>
</body>
</html>
