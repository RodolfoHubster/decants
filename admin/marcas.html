<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Marcas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">

</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Marcas</span>
      </div>
      <button class="btn btn-primary" onclick="window.openModal()"><i class="bi bi-plus-lg"></i> Nueva Marca</button>
    </div>
    <div class="page-body">
      <div class="filter-bar">
        <div class="search-input-wrap" style="max-width:300px"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar marca..." oninput="window.render()"></div>
        <select class="form-control" id="f-cat" style="max-width:200px" onchange="window.render()"><option value="">Todas las categorias</option></select>
      </div>
      <div class="card">
        <div class="card-header"><h5>Marcas de Perfume</h5><span class="badge badge-muted" id="count-label">0 marcas</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Marca</th><th>Categoria</th><th>Origen</th><th>Perfumes</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header"><h4 id="modal-title">Nueva Marca</h4><button class="btn-icon" onclick="window.closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <input type="hidden" id="m-id">
      <div class="form-group"><label>Nombre *</label><input class="form-control" id="m-nombre" placeholder="Lattafa, Versace, Dior..."></div>
      <div class="form-row">
        <div class="form-group"><label>Categoria *</label><select class="form-control" id="m-cat"><option value="">Selecciona</option></select></div>
        <div class="form-group"><label>Pais de origen</label><input class="form-control" id="m-origen" placeholder="Francia, Emiratos..."></div>
      </div>
      <div class="form-group"><label>Descripcion</label><textarea class="form-control" id="m-desc" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="window.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="window.save()"><i class="bi bi-check2"></i> Guardar</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/marcas.js"></script>
</body>
</html>
