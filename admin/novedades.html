<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Novedades · Admin Fitoscents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/novedades.css">
</head>
<body>
<div class="app-shell">
<div id="sidebar-wrap"></div>
<div class="main-content">
<header>

  <div class="hinner">
    <a href="./dashboard.html" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      <span>Dashboard</span>
    </a>
    <div>
      <div class="page-title">🆕 Novedades</div>
      <div class="page-sub">Gestiona el modal de novedades del catálogo</div>
    </div>
  </div>
</header>

<main class="main">
  

  <!-- ── Formulario nueva/editar novedad ── -->
  <div class="card">
    <div class="card-title"><i class="bi bi-plus-circle"></i> <span id="form-title">Nueva Novedad</span></div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Título *</label>
        <input type="text" id="n-titulo" placeholder="ej. ¡Llegaron nuevos perfumes!" maxlength="80">
      </div>
      <div class="form-group full">
        <label>Mensaje</label>
        <textarea id="n-mensaje" placeholder="Describe qué hay de nuevo, promociones, disponibilidad..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Duración (días)</label>
        <input type="number" id="n-duracion" placeholder="0 = sin límite" min="0" max="365" value="0">
        <span class="hint">0 = se muestra indefinidamente hasta que lo desactives</span>
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <label>Estado</label>
        <div class="toggle-row">
          <label class="toggle-switch">
            <input type="checkbox" id="n-activo" checked>
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
          <span class="toggle-label" id="n-activo-label">Activa</span>
        </div>
      </div>
    </div>

    <!-- Selector de perfumes -->
    <div style="margin-top:18px">
      <label style="font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:10px;">
        <i class="bi bi-droplet" style="color:var(--gold)"></i> Perfumes destacados (opcional)
      </label>
      <div class="perf-search-wrap">
        <i class="bi bi-search"></i>
        <input type="text" id="perf-search" placeholder="Buscar perfume para agregar..." autocomplete="off">
      </div>
      <div id="perf-list-wrap"><div class="perf-item" style="color:var(--muted);font-size:13px;justify-content:center">Cargando perfumes...</div></div>
      <div class="selected-chips" id="selected-chips"></div>
    </div>

    <div style="margin-top:20px;display:flex;gap:10px;">
      <button class="btn-save" id="btn-guardar" onclick="guardarNovedad()">
        <i class="bi bi-check-lg"></i> Guardar novedad
      </button>
      <button class="btn-save" id="btn-cancelar-edicion" style="display:none;background:rgba(255,255,255,.05);border-color:var(--border);color:var(--muted);max-width:160px" onclick="cancelarEdicion()">
        Cancelar
      </button>
    </div>
  </div>

  <!-- ── Lista novedades existentes ── -->
  <div class="card">
    <div class="card-title"><i class="bi bi-list-ul"></i> Novedades registradas</div>
    <div class="nov-list" id="nov-list">
      <div class="empty-state"><i class="bi bi-megaphone"></i><p>Cargando...</p></div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script type="module">
import { db, auth, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onAuthStateChanged, query, orderBy, serverTimestamp, where }
  from '../assets/js/firebase-config.js';
  import { renderSidebar } from './sidebar.js';
  renderSidebar('novedades');
// ── Auth guard ────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => { if (!user) window.location.href = '../login.html'; });

// ── Estado ────────────────────────────────────────────────────────────────────
let allPerfumes = [];
let selectedIds = [];
let editingId   = null;

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Toggle label ──────────────────────────────────────────────────────────────
document.getElementById('n-activo').addEventListener('change', function() {
  document.getElementById('n-activo-label').textContent = this.checked ? 'Activa' : 'Inactiva';
});

// ── Cargar perfumes ───────────────────────────────────────────────────────────
async function loadPerfumes() {
  const snap = await getDocs(query(collection(db, 'perfumes'), where('activo','==',true)));
  allPerfumes = [];
  snap.forEach(d => allPerfumes.push({ id: d.id, ...d.data() }));
  allPerfumes.sort((a, b) => (a.marca||'').localeCompare(b.marca||'') || a.nombre.localeCompare(b.nombre));
  renderPerfList('');
}

function renderPerfList(q) {
  const wrap = document.getElementById('perf-list-wrap');
  const q2 = q.toLowerCase().trim();
  const filtered = q2
    ? allPerfumes.filter(p => p.nombre.toLowerCase().includes(q2) || (p.marca||'').toLowerCase().includes(q2))
    : allPerfumes;

  if (!filtered.length) {
    wrap.innerHTML = '<div class="perf-item" style="color:var(--muted);justify-content:center;font-size:13px">Sin resultados</div>';
    return;
  }
  wrap.innerHTML = filtered.map(p => {
    const sel = selectedIds.includes(p.id);
    return `
      <div class="perf-item ${sel ? 'selected' : ''}" data-id="${p.id}" onclick="togglePerf('${p.id}')">
        ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}">` : '<div class="no-img"><i class="bi bi-droplet"></i></div>'}
        <div class="perf-item-info">
          <div class="perf-item-marca">${p.marca||''}</div>
          <div class="perf-item-nombre">${p.nombre}</div>
        </div>
        ${sel ? '<i class="bi bi-check-circle-fill check-icon"></i>' : ''}
      </div>`;
  }).join('');
}

document.getElementById('perf-search').addEventListener('input', function() {
  renderPerfList(this.value);
});

window.togglePerf = id => {
  if (selectedIds.includes(id)) {
    selectedIds = selectedIds.filter(x => x !== id);
  } else {
    selectedIds.push(id);
  }
  renderPerfList(document.getElementById('perf-search').value);
  renderChips();
};

function renderChips() {
  const wrap = document.getElementById('selected-chips');
  wrap.innerHTML = selectedIds.map(id => {
    const p = allPerfumes.find(x => x.id === id);
    if (!p) return '';
    return `<span class="chip">${p.nombre} <button class="chip-rm" onclick="togglePerf('${id}')" aria-label="Quitar">×</button></span>`;
  }).join('');
}

// ── Guardar novedad ────────────────────────────────────────────────────────────
window.guardarNovedad = async () => {
  const titulo   = document.getElementById('n-titulo').value.trim();
  const mensaje  = document.getElementById('n-mensaje').value.trim();
  const duracion = parseInt(document.getElementById('n-duracion').value) || 0;
  const activo   = document.getElementById('n-activo').checked;

  if (!titulo) { toast('⚠️ El título es requerido'); return; }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Guardando...';

  try {
    const data = {
      titulo, mensaje, duracionDias: duracion,
      activo, perfumeIds: selectedIds,
    };

    if (editingId) {
      await updateDoc(doc(db, 'novedades', editingId), data);
      toast('✅ Novedad actualizada');
    } else {
      data.creadoEn = serverTimestamp();
      await addDoc(collection(db, 'novedades'), data);
      toast('✅ Novedad creada');
    }
    resetForm();
    await loadNovedades();
  } catch (e) {
    toast('❌ Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Guardar novedad';
  }
};

function resetForm() {
  document.getElementById('n-titulo').value   = '';
  document.getElementById('n-mensaje').value  = '';
  document.getElementById('n-duracion').value = '0';
  document.getElementById('n-activo').checked = true;
  document.getElementById('n-activo-label').textContent = 'Activa';
  selectedIds = []; renderChips(); renderPerfList('');
  document.getElementById('perf-search').value = '';
  document.getElementById('form-title').textContent = 'Nueva Novedad';
  document.getElementById('btn-cancelar-edicion').style.display = 'none';
  editingId = null;
}

window.cancelarEdicion = resetForm;

// ── Cargar y renderizar novedades existentes ───────────────────────────────────
async function loadNovedades() {
  const list = document.getElementById('nov-list');
  list.innerHTML = '<div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Cargando...</p></div>';

  const snap = await getDocs(query(collection(db, 'novedades'), orderBy('creadoEn', 'desc')));
  const items = [];
  snap.forEach(d => items.push({ id: d.id, ...d.data() }));

  items.sort((a, b) => {
  const fa = a.creadoEn?.toDate?.() ?? new Date(0);
  const fb = b.creadoEn?.toDate?.() ?? new Date(0);
  return fb - fa;
});

  if (!items.length) {
    list.innerHTML = '<div class="empty-state"><i class="bi bi-megaphone"></i><p>Sin novedades todavía. Crea la primera 👆</p></div>';
    return;
  }

  list.innerHTML = items.map(n => {
    const creado = n.creadoEn?.toDate ? n.creadoEn.toDate() : null;
    const fechaStr = creado ? creado.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' }) : '';
    const expirada = n.duracionDias > 0 && creado && new Date() > new Date(creado.getTime() + n.duracionDias * 86400000);
    const tagHtml = expirada
      ? '<span class="tag tag-expirada">Expirada</span>'
      : n.activo
        ? '<span class="tag tag-activa">Activa</span>'
        : '<span class="tag tag-inactiva">Inactiva</span>';
    return `
      <div class="nov-item">
        <div class="nov-item-header">
          <div class="nov-item-info">
            <div class="nov-item-titulo">${n.titulo}</div>
            <div class="nov-item-meta">
              ${tagHtml}
              ${fechaStr ? `<span style="font-size:11px;color:var(--muted)">📅 ${fechaStr}</span>` : ''}
              ${n.duracionDias > 0 ? `<span style="font-size:11px;color:var(--muted)">⏱ ${n.duracionDias} día${n.duracionDias!==1?'s':''}</span>` : '<span style="font-size:11px;color:var(--muted)">Sin límite</span>'}
              ${n.perfumeIds?.length ? `<span style="font-size:11px;color:var(--muted)">💧 ${n.perfumeIds.length} perfume${n.perfumeIds.length!==1?'s':''}</span>` : ''}
            </div>
          </div>
        </div>
        ${n.mensaje ? `<div class="nov-item-msg">${n.mensaje}</div>` : ''}
        <div class="nov-item-actions">
          ${!n.activo || expirada
            ? `<button class="btn-sm btn-activar" onclick="toggleActivo('${n.id}', true)"><i class="bi bi-eye"></i> Activar</button>`
            : `<button class="btn-sm btn-desactivar" onclick="toggleActivo('${n.id}', false)"><i class="bi bi-eye-slash"></i> Desactivar</button>`
          }
          <button class="btn-sm btn-editar" onclick="editarNovedad('${n.id}')"><i class="bi bi-pencil"></i> Editar</button>
          <button class="btn-sm btn-eliminar" onclick="eliminarNovedad('${n.id}')"><i class="bi bi-trash"></i> Eliminar</button>
        </div>
      </div>`;
  }).join('');
}

window.toggleActivo = async (id, activo) => {
  await updateDoc(doc(db, 'novedades', id), { activo });
  toast(activo ? '✅ Novedad activada' : '⭕ Novedad desactivada');
  loadNovedades();
};

window.eliminarNovedad = async id => {
  if (!confirm('¿Eliminar esta novedad?')) return;
  await deleteDoc(doc(db, 'novedades', id));
  toast('🗑️ Novedad eliminada');
  loadNovedades();
};

window.editarNovedad = async id => {
  const snap = await getDocs(collection(db, 'novedades'));
  let data = null;
  snap.forEach(d => { if (d.id === id) data = { id: d.id, ...d.data() }; });
  if (!data) return;

  editingId = id;
  document.getElementById('n-titulo').value   = data.titulo || '';
  document.getElementById('n-mensaje').value  = data.mensaje || '';
  document.getElementById('n-duracion').value = data.duracionDias || 0;
  document.getElementById('n-activo').checked = !!data.activo;
  document.getElementById('n-activo-label').textContent = data.activo ? 'Activa' : 'Inactiva';
  selectedIds = [...(data.perfumeIds || [])]; renderChips(); renderPerfList('');
  document.getElementById('form-title').textContent = 'Editar Novedad';
  document.getElementById('btn-cancelar-edicion').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
// ── Init ───────────────────────────────────────────────────────────────────────
loadPerfumes();
loadNovedades();
</script>
</body>
</html>
