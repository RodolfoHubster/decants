<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Encargos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/perfumes.css">
  <link rel="stylesheet" href="../assets/css/encargos.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Encargos</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="display:flex;gap:4px;background:var(--bg-card2);padding:4px;border-radius:6px;border:1px solid var(--border)">
          <button class="btn btn-sm btn-outline" id="btn-view-table" style="padding:4px 8px;font-size:12px;background:var(--accent);color:#000" onclick="setView('table')"><i class="bi bi-table"></i> Tabla</button>
          <button class="btn btn-sm btn-outline" id="btn-view-kanban" style="padding:4px 8px;font-size:12px;opacity:0.7" onclick="setView('kanban')"><i class="bi bi-kanban"></i> Kanban</button>
        </div>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Encargo</button>
      </div>
    </div>
    <div class="page-body">
      <!-- Stats mini -->
      <div class="stats-row">
        <div class="stat-mini"><span class="val" id="s-pendientes">0</span><span class="lbl">Pendientes</span></div>
        <div class="stat-mini"><span class="val" id="s-buscando">0</span><span class="lbl">Buscando</span></div>
        <div class="stat-mini"><span class="val" id="s-conseguido">0</span><span class="lbl">Conseguidos</span></div>
        <div class="stat-mini"><span class="val" id="s-avisado">0</span><span class="lbl">Avisados</span></div>
        <div class="stat-mini"><span class="val" id="s-entregado">0</span><span class="lbl">Entregados</span></div>
      </div>
      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar perfume o cliente..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:170px" id="f-estado" onchange="renderTable()">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="buscando">Buscando proveedor</option>
          <option value="conseguido">Conseguido</option>
          <option value="avisado">Avisado al cliente</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
          <option value="quedo_mal">Quedó mal</option>
        </select>
      </div>
      <!-- Toolbar with bulk actions and pagination -->
      <div class="toolbar" style="display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap">
        <select class="form-control" id="bulk-action" style="max-width:180px">
          <option value="">Acciones en lote</option>
          <option value="pendiente">Marcar como Pendiente</option>
          <option value="buscando">Marcar como Buscando</option>
          <option value="conseguido">Marcar como Conseguido</option>
          <option value="avisado">Marcar como Avisado</option>
          <option value="entregado">Marcar como Entregado</option>
          <option value="quedo_mal">Marcar como Quedó mal</option>
          <option value="cancelado">Eliminar</option>
          <option value="export">Exportar CSV</option>
        </select>
        <button class="btn btn-outline btn-sm icon-btn-mobile" onclick="applyBulkAction()" title="Aplicar">
          <i class="bi bi-check2"></i> <span>Aplicar</span>
        </button>
        <select class="form-control" id="page-size" style="max-width:100px" onchange="changePageSize(this.value)">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
      </div>
      <!-- Table View Container -->
      <div id="table-container" class="card">
        <div class="card-header"><h5>Lista de Encargos</h5><span class="badge badge-muted" id="count-label">0 encargos</span></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" id="select-all"/></th>
                <th>Perfume</th>
                <th>Marca</th>
                <th>Tamaño</th>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Kanban View Container -->
      <div id="kanban-container" style="display:none;margin-top:16px">
        <div class="kanban-board">
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #fbbf24">
              <span><i class="bi bi-hourglass-split"></i> Pendiente</span>
              <span class="count" id="k-count-pendiente">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-pendiente" data-status="pendiente" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #818cf8">
              <span><i class="bi bi-search"></i> Buscando</span>
              <span class="count" id="k-count-buscando">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-buscando" data-status="buscando" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #22c55e">
              <span><i class="bi bi-check-circle-fill"></i> Conseguido</span>
              <span class="count" id="k-count-conseguido">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-conseguido" data-status="conseguido" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #38bdf8">
              <span><i class="bi bi-telephone"></i> Avisado</span>
              <span class="count" id="k-count-avisado">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-avisado" data-status="avisado" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #94a3b8">
              <span><i class="bi bi-box-seam"></i> Entregado</span>
              <span class="count" id="k-count-entregado">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-entregado" data-status="entregado" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #ef4444">
              <span><i class="bi bi-x-circle-fill"></i> Cancelado</span>
              <span class="count" id="k-count-cancelado">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-cancelado" data-status="cancelado" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-col-header" style="border-left: 3px solid #7f1d1d">
              <span><i class="bi bi-hand-thumbs-down-fill"></i> Quedó mal</span>
              <span class="count" id="k-count-quedo_mal">0</span>
            </div>
            <div class="kanban-cards" id="k-cards-quedo_mal" data-status="quedo_mal" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVO ENCARGO -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header">
      <h4 id="modal-title">Nuevo Encargo</h4>
      <button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="e-id">
      <div class="form-row">
        <div class="form-group"><label>Perfume *</label><input class="form-control" id="e-perfume" placeholder="Nombre del perfume..."></div>
        <div class="form-group"><label>Marca *</label><input class="form-control" id="e-marca" placeholder="Dior, Chanel..."></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tamaño *</label>
          <select class="form-control" id="e-tamano">
            <option value="">Selecciona</option>
            <option>30 ml</option><option>50 ml</option><option>75 ml</option>
            <option>100 ml</option><option>150 ml</option><option>200 ml</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Concentración</label>
          <select class="form-control" id="e-concentracion">
            <option value="">—</option>
            <option>EDP</option><option>EDT</option><option>EDC</option><option>Parfum</option><option>Oil</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="position:relative;">
          <label>Nombre del cliente *</label>
          <input class="form-control" id="e-cliente" placeholder="Buscar o crear nuevo..." autocomplete="off">
          <div id="e-cliente-dropdown" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:9999; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; margin-top:4px; max-height:200px; overflow-y:auto; box-shadow:0 8px 16px rgba(0,0,0,0.5); flex-direction:column;"></div>
        </div>
        <div class="form-group">
          <label>Medio de contacto</label>
          <select class="form-control" id="e-medio" onchange="actualizarContactoPlaceholder()">
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram</option>
            <option value="messenger">Facebook (Messenger)</option>
            <option value="tiktok">TikTok</option>
            <option value="otro">Otro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label id="lbl-contacto">Teléfono (WhatsApp) *</label>
          <input class="form-control" id="e-contacto" placeholder="+52 999 000 0000">
        </div>
        <div class="form-group">
          <label>Adelanto (MXN)</label>
          <input class="form-control" type="number" id="e-adelanto" min="0" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio acordado (MXN) *</label>
          <input class="form-control" type="number" id="e-precio" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select class="form-control" id="e-estado">
            <option value="pendiente">Pendiente</option>
            <option value="buscando">Buscando proveedor</option>
            <option value="conseguido">Conseguido</option>
            <option value="avisado">Avisado al cliente</option>
            <option value="entregado">Entregado</option>
            <option value="cancelado">Cancelado</option>
            <option value="quedo_mal">Quedó mal</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Notas internas</label><textarea class="form-control" id="e-notas" rows="2" placeholder="Proveedor, link, detalles del encargo..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar Encargo</button>
    </div>
  </div>
</div>
<script type="module" src="../assets/js/encargos.js"></script>
</body>
</html>
