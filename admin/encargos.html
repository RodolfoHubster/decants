<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Encargos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/perfumes.css">
  <link rel="stylesheet" href="../assets/css/encargos.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Encargos — Botellas Completas</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Encargo</button>
    </div>
    <div class="page-body">
      <!-- Stats mini -->
      <div class="stats-row">
        <div class="stat-mini"><span class="val" id="s-pendientes">0</span><span class="lbl">Pendientes</span></div>
        <div class="stat-mini"><span class="val" id="s-buscando">0</span><span class="lbl">Buscando</span></div>
        <div class="stat-mini"><span class="val" id="s-conseguido">0</span><span class="lbl">Conseguidos</span></div>
        <div class="stat-mini"><span class="val" id="s-avisado">0</span><span class="lbl">Avisados</span></div>
        <div class="stat-mini"><span class="val" id="s-entregado">0</span><span class="lbl">Entregados</span></div>
      </div>
      <div class="filter-bar">
        <div class="search-input-wrap"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Buscar perfume o cliente..." oninput="renderTable()"></div>
        <select class="form-control" style="max-width:170px" id="f-estado" onchange="renderTable()">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="buscando">Buscando proveedor</option>
          <option value="conseguido">Conseguido</option>
          <option value="avisado">Avisado al cliente</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div class="card">
        <div class="card-header"><h5>Lista de Encargos</h5><span class="badge badge-muted" id="count-label">0 encargos</span></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Perfume</th>
                <th>Marca</th>
                <th>Tamaño</th>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVO ENCARGO -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header">
      <h4 id="modal-title">Nuevo Encargo</h4>
      <button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="e-id">
      <div class="form-row">
        <div class="form-group"><label>Perfume *</label><input class="form-control" id="e-perfume" placeholder="Nombre del perfume..."></div>
        <div class="form-group"><label>Marca *</label><input class="form-control" id="e-marca" placeholder="Dior, Chanel..."></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tamaño *</label>
          <select class="form-control" id="e-tamano">
            <option value="">Selecciona</option>
            <option>30 ml</option><option>50 ml</option><option>75 ml</option>
            <option>100 ml</option><option>150 ml</option><option>200 ml</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Concentración</label>
          <select class="form-control" id="e-concentracion">
            <option value="">—</option>
            <option>EDP</option><option>EDT</option><option>EDC</option><option>Parfum</option><option>Oil</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Nombre del cliente *</label><input class="form-control" id="e-cliente" placeholder="Nombre completo..."></div>
        <div class="form-group"><label>Contacto (WhatsApp)</label><input class="form-control" id="e-contacto" placeholder="+52 999 000 0000"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio acordado (MXN)</label>
          <input class="form-control" type="number" id="e-precio" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select class="form-control" id="e-estado">
            <option value="pendiente">⏳ Pendiente</option>
            <option value="buscando">🔍 Buscando proveedor</option>
            <option value="conseguido">✅ Conseguido</option>
            <option value="avisado">📱 Avisado al cliente</option>
            <option value="entregado">📦 Entregado</option>
            <option value="cancelado">❌ Cancelado</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Notas internas</label><textarea class="form-control" id="e-notas" rows="2" placeholder="Proveedor, link, detalles del encargo..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar Encargo</button>
    </div>
  </div>
</div>
<script type="module" src="../assets/js/encargos.js"></script>
</body>
</html>
