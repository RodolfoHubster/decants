<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fitoscents · Puntos Externos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
  <style>
    .cons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .cons-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display:flex; flex-direction:column; gap:15px; }
    .cons-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .cons-title { font-size: 18px; font-weight: 700; color: var(--accent); margin:0 0 5px 0; }
    .cons-date { font-size: 12px; color: var(--text-faint); }
    .cons-status { font-size: 11px; padding: 4px 8px; border-radius: 99px; font-weight: 600; text-transform: uppercase; }
    .status-open { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .status-closed { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
    
    .cons-items { border-top: 1px solid var(--border); padding-top: 15px; display:flex; flex-direction:column; gap:10px; flex:1; }
    .cons-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card2); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .cons-item-info { flex:1; }
    .cons-item-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; line-height:1.2; }
    .cons-item-meta { font-size: 12px; color: var(--text-muted); display:flex; gap:10px; }
    .cons-item-actions { display: flex; align-items: center; gap: 8px; }
    
    .btn-sell { background: rgba(201, 168, 76, 0.15); color: #C9A84C; border: 1px solid rgba(201, 168, 76, 0.3); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-sell:hover { background: #C9A84C; color: #000; }
    .btn-sell:disabled { opacity: 0.5; cursor: not-allowed; background:var(--bg-card2); border-color:var(--border); color:var(--text-muted); }
    
    /* Modal styles */
    .item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 10px; align-items: end; margin-bottom: 10px; }
    @media (max-width: 600px) {
      .item-row { grid-template-columns: 1fr; gap:5px; margin-bottom:15px; background:var(--bg-card2); padding:10px; border-radius:8px;}
    }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Puntos Externos (Consignaciones)</span>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Lote</button>
      </div>
    </div>
    
    <div class="page-body">
      <div id="loading" style="text-align:center;padding:40px;color:var(--text-muted)"><i class="bi bi-hourglass-split"></i> Cargando...</div>
      <div id="cons-grid" class="cons-grid" style="display:none;"></div>
      <div id="empty-state" style="display:none; text-align:center; padding:60px 20px;">
        <i class="bi bi-shop" style="font-size:48px; color:var(--text-faint); margin-bottom:15px; display:block;"></i>
        <h3 style="margin-bottom:10px; color:var(--text-primary)">No hay lotes en consignación</h3>
        <p style="color:var(--text-muted)">Crea un lote para administrar los decants que dejas en barberías u otros puntos de venta.</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nuevo Lote -->
<div class="modal-overlay" id="modal-nuevo">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header">
      <h3 id="modal-title">Crear Lote de Consignación</h3>
      <button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="c-edit-id">
      <div class="form-group">
        <label>Lugar / Punto de Venta (Ej. Barbería El Buki)</label>
        <input type="text" id="c-lugar" class="form-control" placeholder="Nombre del lugar">
      </div>
      
      <div style="margin-top:20px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <label style="margin:0; font-weight:600;">Perfumes a dejar</label>
        <button class="btn btn-sm btn-outline" onclick="addItemRow()"><i class="bi bi-plus"></i> Añadir</button>
      </div>
      
      <div id="items-container"></div>
      
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="guardarLote()"><i class="bi bi-check2"></i> Guardar Lote</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/consignaciones.js?v=1.0"></script>
</body>
</html>
