<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin - Paquetes (Combos) · Fitoscents</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <style>
    .item-selected { display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--bg-card2); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
    .item-selected-remove { color:#ef4444; cursor:pointer; font-size:18px; background:none; border:none; padding:4px; }
    .sug-item { padding:10px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; gap:10px; align-items:center; }
    .sug-item:hover { background:var(--bg-card2); }
  </style>
</head>
<body>
<div id="toast"></div>

<div class="app-shell">
  <div id="sidebar-wrap"></div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
        <span class="topbar-title">Paquetes / Combos</span>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo Paquete</button>
      </div>
    </div>
    
    <div class="page-body">
      <div class="filter-bar" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;background:var(--bg-card);padding:14px;border:1px solid var(--border);border-radius:12px;align-items:center;">
        <div class="search-input-wrap" style="position:relative;flex:1;min-width:200px;">
          <i class="bi bi-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#888;"></i>
          <input type="text" id="q" class="form-control" placeholder="Buscar paquete..." style="padding-left:36px;width:100%" oninput="renderTable()">
        </div>
        <select class="form-control" style="width:160px" id="f-estado" onchange="renderTable()">
          <option value="todos">Todos los estados</option>
          <option value="activos">Solo Activos</option>
          <option value="ocultos">Solo Ocultos</option>
        </select>
        <select class="form-control" style="width:160px" id="f-cat" onchange="renderTable()">
          <option value="todos">Todas las categorías</option>
          <option value="Caballero">Caballero</option>
          <option value="Dama">Dama</option>
          <option value="Unisex">Unisex</option>
          <option value="mixto">Mixto / Cualquiera</option>
        </select>
        <select class="form-control" style="width:180px" id="f-orden" onchange="renderTable()">
          <option value="recientes">✨ Más recientes</option>
          <option value="az">Nombre A-Z</option>
          <option value="za">Nombre Z-A</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header" style="justify-content:space-between">
          <h5 style="margin:0"><i class="bi bi-box2-heart"></i> Listado de Paquetes</h5>
          <span class="badge badge-muted" id="count-label">0 paquetes</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Imagen</th><th>Nombre</th><th>Descripción</th><th>Tamaños y Precios</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL PAQUETE -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-header"><h4 id="modal-title">Nuevo Paquete</h4><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" style="max-height:75vh;overflow-y:auto;">
      <input type="hidden" id="p-id">
      
      <div class="form-row">
        <div class="form-group"><label>Nombre del Paquete *</label><input class="form-control" id="p-nombre" placeholder="Ej. Paquete Seductor"></div>
        <div class="form-group">
          <label>Categoría (Para Filtros)</label>
          <select class="form-control" id="p-cat">
            <option value="">Cualquiera / Mixto</option>
            <option value="Caballero">Caballero</option>
            <option value="Dama">Dama</option>
            <option value="Unisex">Unisex</option>
          </select>
        </div>
      </div>
      
      <div class="form-group">
        <label>Precios por tamaño (MXN) — 0 si no aplica</label>
        <div class="precios-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;">
          <div class="precio-item"><label>3 ml</label><input class="form-control" type="number" id="px3" min="0" placeholder="0"></div>
          <div class="precio-item"><label>5 ml</label><input class="form-control" type="number" id="px5" min="0" placeholder="0"></div>
          <div class="precio-item"><label>10 ml</label><input class="form-control" type="number" id="px10" min="0" placeholder="0"></div>
        </div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px;">El ahorro se calculará automáticamente según la suma de los perfumes individuales.</div>
      </div>

      <div class="form-group"><label>Descripción / Detalles</label><textarea class="form-control" id="p-desc" rows="2" placeholder="Ideal para citas de noche. Incluye notas maderosas..."></textarea></div>
      
      <div class="form-group">
        <label>Imagen</label>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button type="button" class="btn btn-outline btn-sm" id="btn-url" onclick="setMode('url')"><i class="bi bi-link-45deg"></i> URL</button>
          <button type="button" class="btn btn-outline btn-sm" id="btn-file" onclick="setMode('file')"><i class="bi bi-upload"></i> Subir</button>
        </div>
        <div id="sec-url"><input class="form-control" id="p-img-url" placeholder="https://..." oninput="previewUrl()"></div>
        <div id="sec-file" style="display:none">
          <input type="file" class="form-control" id="p-img-file" accept="image/*" onchange="previewFile()">
        </div>
        <div id="preview-wrap" class="img-preview-wrap" style="display:none;margin-top:10px"><img id="preview-img" src="" alt=""></div>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;">
      
      <div class="form-group" style="background:var(--bg-card2); padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:15px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer; font-weight:600; margin-bottom:0;">
          <input type="checkbox" id="p-personalizable" style="width:16px;height:16px;accent-color:var(--accent)" onchange="togglePersonalizable()">
          Paquete Personalizable (El cliente elige los perfumes)
        </label>
        <div id="pers-options" style="display:none; margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;">
          <label>Cantidad de perfumes a elegir (Ej. 3)</label>
          <input type="number" class="form-control" id="p-max-sel" min="1" max="10" placeholder="3" style="max-width:120px;">
        </div>
      </div>

      <div class="form-group">
        <label id="lbl-perfumes">Perfumes incluidos en el paquete *</label>
        <div style="display:flex;gap:10px;margin-bottom:10px;">
          <input type="text" id="search-perfume" class="form-control" placeholder="Buscar perfume por nombre..." autocomplete="off">
        </div>
        <!-- Lista de sugerencias absolute -->
        <div id="sugerencias-box" style="position:relative; z-index:9000; width:100%; display:none;">
          <div id="sugerencias-list" style="position:absolute; top:0; left:0; width:100%; max-height:200px; overflow-y:auto; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.5);"></div>
        </div>

        <div id="paquete-items-list" style="margin-top:10px; min-height:50px; padding:10px; border:1px dashed var(--border); border-radius:8px;">
          <!-- Lista de perfumes seleccionados -->
          <div style="color:var(--text-faint);text-align:center;font-size:13px;margin:10px 0;" id="empty-items">No has agregado perfumes aún.</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="p-activo" checked style="width:16px;height:16px;accent-color:var(--accent)">
          Activo y visible en la tienda
        </label>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="save()"><i class="bi bi-check2"></i> Guardar Paquete</button>
    </div>
  </div>
</div>

<script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
<script type="module" src="../assets/js/paquetes.js?v=1.7"></script>
</body>
</html>
