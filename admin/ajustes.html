<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="../assets/img/LogoOficial2.jpeg">
  <link rel="apple-touch-icon" href="../assets/img/LogoOficial2.jpeg">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ajustes · Admin Fitoscents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }
    .hint {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--bg-card2);
    }
  </style>
</head>
<body>
<div class="app-shell">
<div id="sidebar-wrap"></div>
<div class="main-content">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn-icon" id="menu-btn" onclick="toggleSidebar()" style="display:none"><i class="bi bi-list" style="font-size:20px"></i></button>
      <span class="topbar-title">Ajustes</span>
    </div>
  </div>

  <div class="page-body">
    <div class="card">
      <div class="card-title"><i class="bi bi-robot"></i> OpenAI API (GPT-4o)</div>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
        Configura tu llave de API (API Key) de OpenAI para habilitar el autocompletado mágico y análisis. La llave se guardará de forma <strong>100% segura en el almacenamiento local de tu dispositivo</strong>.
      </p>
    
    <div class="form-group" style="margin-top: 15px;">
      <label>OpenAI API Key</label>
      <div style="display: flex; gap: 10px;">
        <input type="password" id="gemini-key" class="form-control" placeholder="sk-..." autocomplete="off" style="padding-right: 40px;">
        <button class="btn btn-outline" id="btn-toggle-view" onclick="toggleView()" title="Mostrar/Ocultar"><i class="bi bi-eye"></i></button>
      </div>
      <span class="hint">Obtén tu API Key en <a href="https://platform.openai.com/api-keys" target="_blank" style="color:var(--accent)">platform.openai.com</a></span>
    </div>
    
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
      <button class="btn btn-outline" id="btn-delete" onclick="deleteKey()" style="display:none; color: #ff6b6b; border-color: #ff6b6b22; background: #ff6b6b11;"><i class="bi bi-trash"></i> Eliminar Llave</button>
      <button class="btn btn-outline" id="btn-test" onclick="testKey()" style="display:none; color: #2e7d32; border-color: #2e7d3222; background: #2e7d3211;"><i class="bi bi-lightning-charge"></i> Probar Conexión</button>
      <button class="btn btn-primary" onclick="saveKey()"><i class="bi bi-check2"></i> Guardar Configuración</button>
    </div>
  </div>

    </div>
  </div>
  <div id="toast-container"></div>
</div>
</div>
</div>

<script type="module" src="../assets/js/ajustes.js?v=1.0"></script>
</body>
</html>
